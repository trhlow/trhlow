<rect x="8" y="8" width="384" height="274" rx="20" fill="url(#edge)"/>
<rect x="6" y="6" width="384" height="274" rx="20" fill="url(#edge)"/>
<rect x="4" y="4" width="384" height="274" rx="20" fill="url(#edge)"/>
<rect x="2" y="2" width="384" height="274" rx="20" fill="url(#face)" stroke="#6fe3e3" stroke-opacity=".55" stroke-width="1.5"/>
<g clip-path="url(#cl)"><rect x="2" y="2" width="384" height="274" fill="url(#halo)"/>
<rect class="sh" x="0" y="-20" width="160" height="330" fill="url(#shine)"/></g>
