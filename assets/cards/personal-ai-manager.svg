<rect x="2" y="2" width="584" height="314" rx="20" fill="url(#face)" stroke="#ff7b8a" stroke-opacity=".55" stroke-width="1.5"/>
<g clip-path="url(#cl)"><rect x="2" y="2" width="584" height="314" fill="url(#halo)"/>
