<circle class="n3" cx="872.0" cy="10" r="5" fill="#1a7f37" opacity="0"/>
<text x="880.0" y="38" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#59636e">One-time check-in</text>
