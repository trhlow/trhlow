name: Update README

on:
  schedule:
    - cron: "0 0 * * *" # 07:00 Asia/Ho_Chi_Minh
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/update_readme.py", ".github/workflows/update-readme.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - run: python scripts/update_readme.py --self-test

      - run: python scripts/update_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}

      - name: Commit if the showcase changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.vi.md
          if git commit -m "chore: refresh showcased repos"; then git push; fi
